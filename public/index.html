<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maktab rasmiy sayti</title>
<script>try{document.documentElement.dataset.theme=localStorage.th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<body>
<header class="top">
  <button class="brand" data-go="" aria-label="Bosh sahifa">

      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1e7bf0"/><path d="M9 13c4-1.5 8-1 11 1.5 3-2.5 7-3 11-1.5v15c-4-1.5-8-1-11 1.5-3-2.5-7-3-11-1.5z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M20 14.5v15" stroke="#fff" stroke-width="2"/></svg>
      <img src="img/logo.png" alt="" onload="this.parentNode.classList.add('has')" onerror="this.remove()">
    </span>
    <span class="bn"><b id="b1"></b><b id="b2"></b></span>

  <div class="hr">
    <button class="sw" data-theme-toggle role="switch" aria-checked="false" aria-label="Qorong'u rejim" title="Yorug / qorong'u rejim">
      <svg class="si" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="mo" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <i class="swk"></i>
    </button>
    <button class="burger" data-burger aria-label="Menyu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>
<nav id="mnav" class="mnav" aria-label="Menyu" hidden></nav>
<main id="app"></main>
<div id="modal" class="modal" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <button class="x" aria-label="Yopish">×</button>

  </div>
</div>
<script src="malumotlar.js"></script>
